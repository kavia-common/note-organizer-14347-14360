/*
  Helper include file for CI/analysis tools that evaluate additional init scripts.
  It maps the Android :app module to the Expo-prebuilt location if present.
*/
gradle.settingsEvaluated {
    try {
        def appDir = new File(rootDir, 'notes_frontend/android/app')
        if (appDir.exists()) {
            if (!rootProject.childProjects.containsKey('app')) {
                include ':app'
                project(':app').projectDir = appDir
            } else {
                project(':app').projectDir = appDir
            }
        }
    } catch (Throwable ignored) {
        // No-op: analysis tool may not need this
    }
}
